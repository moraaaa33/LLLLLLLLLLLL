<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الامتحانات الإلكترونية - بوابة الطالب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between p-4">

    <!-- Header / اللوجو والعنوان -->
    <header class="text-center my-6">
        <h1 class="text-3xl font-bold text-indigo-700">منصة الاختيارات والاختبارات</h1>
        <p class="text-slate-500 mt-2">أهلاً بك عزيزي الطالب، يرجى تسجيل بياناتك للبدء</p>
    </header>

    <!-- Main Container / كارت التسجيل -->
    <main class="max-w-md w-full mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
        
        <!-- Step 1: Input Student & Parent Info -->
        <div id="step-registration">
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">بيانات الدخول</h2>
            
            <form id="studentLoginForm" onsubmit="handleSendOTP(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الطالب رباعي</label>
                    <input type="text" id="studentName" required placeholder="أدخل اسمك الكترونياً" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">رقم هاتف الطالب</label>
                    <input type="tel" id="studentPhone" pattern="^01[0125][0-9]{8}$" required placeholder="01xxxxxxxxx" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">رقم واتساب ولي الأمر (للتأكيد والنتائج)</label>
                    <input type="tel" id="parentPhone" pattern="^01[0125][0-9]{8}$" required placeholder="01xxxxxxxxx" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">المرحلة الدراسية</label>
                    <select id="academicStage" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">اختر الصف الدراسي...</option>
                        <option value="prep1">الصف الأول الإعدادي</option>
                        <option value="prep2">الصف الثاني الإعدادي</option>
                        <option value="prep3">الصف الثالث الإعدادي</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    إرسال رمز التأكيد (OTP)
                </button>
            </form>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step-otp" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-2">تأكيد رمز الدخول</h2>
            <p class="text-sm text-slate-500 mb-4">تم إرسال رمز مكون من 4 أرقام عبر الواتساب إلى رقم ولي الأمر.</p>

            <form id="otpVerifyForm" onsubmit="handleVerifyOTP(event)" class="space-y-4">
                <div>
                    <input type="text" id="otpInput" maxlength="4" required placeholder="X - X - X - X" class="w-full text-center text-2xl tracking-widest py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    تأكيد وبدء الاختبار
                </button>
            </form>
        </div>

    </main>

    <!-- Footer / رابط الانتقال لصفحة المعلم (الأدمن) -->
    <footer class="mt-8 text-center pb-4">
        <p class="text-xs text-slate-400 mb-2">جميع الحقوق محفوظة © 2026</p>
        <a href="teacher.html" class="inline-flex items-center gap-1 text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition">
            <span>دخول المعلم / الإدارة</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
    </footer>

    <!-- Logic Script -->
    <script>
        let currentOTP = null;

        function handleSendOTP(event) {
            event.preventDefault();
            
            // توليد كود عشوائي من 4 أرقام
            currentOTP = Math.floor(1000 + Math.random() * 9000).toString();
            
            const parentPhone = document.getElementById('parentPhone').value;
            
            // إظهار كود توضيحي للتجربة في تنبيه الموبايل/المتصفح
            alert(`[رمز تجريبي]: تم إرسال الرمز ${currentOTP} إلى رقم ولي الأمر (${parentPhone})`);

            // إخفاء النموذج الأول وإظهار خانة تأكيد OTP
            document.getElementById('step-registration').classList.add('hidden');
            document.getElementById('step-otp').classList.remove('hidden');
        }

        function handleVerifyOTP(event) {
            event.preventDefault();
            const userOTP = document.getElementById('otpInput').value;

            if (userOTP === currentOTP) {
                alert("تم التأكيد بنجاح! جاري تحويلك للامتحان...");
                // هنا يتم توجيه الطالب لصفحة الاختبارات
            } else {
                alert("رمز التأكيد غير صحيح! يرجى المحاولة مرة أخرى.");
            }
        }
    </script>
</body>
</html>
